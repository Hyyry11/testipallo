<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Inventory Management</h1>
            <p class="subtitle">Manage your retail store inventory with ease</p>
        </header>

        <div class="actions-bar">
            <button class="btn btn-primary" onclick="showAddModal()">
                <span>➕</span> Add Product
            </button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search products..." onkeyup="filterProducts()">
            </div>
            <div class="stats">
                <span id="totalProducts">0</span> Products | 
                <span id="totalValue">$0.00</span> Total Value
            </div>
        </div>

        <div class="products-container" id="productsContainer">
            <div class="loading">Loading products...</div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Product</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productSku">SKU *</label>
                        <input type="text" id="productSku" required>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category *</label>
                        <input type="text" id="productCategory" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Price ($) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productQuantity">Quantity *</label>
                        <input type="number" id="productQuantity" min="0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <input type="hidden" id="productId">
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Quantity Update Modal -->
    <div id="quantityModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Update Quantity</h2>
                <span class="close" onclick="closeQuantityModal()">&times;</span>
            </div>
            <form id="quantityForm" onsubmit="updateQuantity(event)">
                <div class="form-group">
                    <label for="newQuantity">New Quantity</label>
                    <input type="number" id="newQuantity" min="0" required>
                </div>
                <input type="hidden" id="quantityProductId">
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeQuantityModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
